services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # loopback only — reachable via SSH tunnel, not the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:      postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET:        ${JWT_SECRET}
      PASSWORD_PEPPER:   ${PASSWORD_PEPPER}
      SENDGRID_API_KEY:  ${SENDGRID_API_KEY}
      EMAIL_FROM:        ${EMAIL_FROM}
      EMAIL_FROM_NAME:   ${EMAIL_FROM_NAME:-Gamgee}
      APP_BASE_URL:      ${APP_BASE_URL}
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:     ${VAPID_SUBJECT:-mailto:admin@example.com}
    # No --reload, no volume mount — code is baked into the image
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # NOT exposed to host — nginx inside the frontend container proxies /api/* to here

  frontend:
    build:
      context: ./frontend
      target: production        # multi-stage: builds React, serves via nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"    # only reachable from localhost — Caddy proxies here

volumes:
  postgres_data:
