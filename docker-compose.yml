services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamgee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamgee}
      POSTGRES_DB: ${POSTGRES_DB:-gamgee}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamgee}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:      postgresql://${POSTGRES_USER:-gamgee}:${POSTGRES_PASSWORD:-gamgee}@db:5432/${POSTGRES_DB:-gamgee}
      JWT_SECRET:        ${JWT_SECRET:-change-me-in-production-please}
      PASSWORD_PEPPER:   ${PASSWORD_PEPPER:-}
      SENDGRID_API_KEY:  ${SENDGRID_API_KEY:-}
      EMAIL_FROM:        ${EMAIL_FROM:-no-reply@example.com}
      EMAIL_FROM_NAME:   ${EMAIL_FROM_NAME:-Gamgee}
      APP_BASE_URL:      ${APP_BASE_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: node node_modules/vite/bin/vite.js --host

volumes:
  postgres_data:
