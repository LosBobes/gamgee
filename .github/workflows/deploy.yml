name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

# The remote script lives in a workflow-level env var so the retry step below
# can't drift out of sync with the first attempt.
env:
  DEPLOY_SCRIPT: |
    set -e
    cd "${{ secrets.DEPLOY_PATH }}"

    echo "▶ Pulling latest code..."
    git fetch origin main
    git reset --hard origin/main

    echo "▶ Rebuilding containers..."
    # Unset anything the GH secret left empty so compose falls back to
    # whatever's in the box's .env (instead of overriding with "").
    # Use if/fi (not `test && unset`) so the loop always exits 0 —
    # otherwise script_stop aborts here when the last var is non-empty.
    for v in SENDGRID_API_KEY EMAIL_FROM EMAIL_FROM_NAME APP_BASE_URL; do
      if [ -z "${!v}" ]; then unset "$v"; fi
    done
    export SENDGRID_API_KEY EMAIL_FROM EMAIL_FROM_NAME APP_BASE_URL 2>/dev/null || true
    docker compose -f docker-compose.prod.yml up --build -d --remove-orphans

    echo "▶ Pruning old images..."
    docker image prune -f

    echo "▶ Running containers:"
    docker compose -f docker-compose.prod.yml ps

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: SSH deploy
        id: attempt1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Forwarded into the remote shell via `envs:` below so docker
          # compose substitutes them into docker-compose.prod.yml. The .env
          # file on the box keeps POSTGRES_*, JWT_SECRET etc.; these layer
          # on top because shell env beats the env_file in compose.
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME:  ${{ secrets.EMAIL_FROM_NAME }}
          APP_BASE_URL:     ${{ secrets.APP_BASE_URL }}
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     ${{ secrets.HETZNER_PORT || 22 }}
          # Give a busy box more than the default 30s to accept the
          # connection before declaring a dial timeout.
          timeout: 90s
          envs: SENDGRID_API_KEY,EMAIL_FROM,EMAIL_FROM_NAME,APP_BASE_URL
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      # A single dial timeout is often a transient network blip (runner
      # egress, brief host hiccup) — wait, then try once more before failing
      # the deploy for real.
      - name: Wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 30

      - name: SSH deploy (retry)
        if: steps.attempt1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME:  ${{ secrets.EMAIL_FROM_NAME }}
          APP_BASE_URL:     ${{ secrets.APP_BASE_URL }}
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     ${{ secrets.HETZNER_PORT || 22 }}
          timeout: 90s
          envs: SENDGRID_API_KEY,EMAIL_FROM,EMAIL_FROM_NAME,APP_BASE_URL
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Connectivity hint
        if: failure()
        run: |
          echo "::error::Both SSH attempts to the deploy host timed out or failed."
          echo "Check that the box is up (make ssh), that the HETZNER_HOST/HETZNER_PORT secrets still point at it,"
          echo "and that its firewall / fail2ban isn't blocking GitHub-hosted runner IPs on the SSH port."
